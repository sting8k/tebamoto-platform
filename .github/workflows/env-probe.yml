name: envprobe
on: pull_request
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: whoami
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "url_present=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes} tok_present=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            J=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" | jq -r .value)
            echo "jwt_len=${#J}"
            P=$(printf %s "$J" | cut -d. -f2); while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
            printf %s "$P" | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{iss,aud,sub,event_name,environment}'
          else
            echo "NO-OIDC"
          fi
